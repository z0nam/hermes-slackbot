name: slack-model-display
version: "1.0.0"
description: "Opt-in Slack final-answer names using observed models or explicit unknown, without extra API calls"
author: "Namun Cho"
provides_hooks:
  - pre_gateway_dispatch
  - pre_api_request
  - post_api_request
  - post_llm_call
config_schema:
  base_name:
    type: string
    default: ""
    description: "Base display name; empty uses the adapter's authenticated workspace bot name"
